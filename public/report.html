<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pitch report · Pitch Pit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23150c2b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27%23ffc24a%27/%3E%3C/svg%3E"><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/pitch.css">
<style>
.wrap{max-width:1280px;margin:0 auto;padding:22px 28px 70px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.brand{font:800 28px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;text-decoration:none}
.brand i{width:13px;height:13px;border-radius:50%;background:var(--gold)}
.who-line{color:var(--dim);font-size:19px;margin-bottom:18px}
.who-line b{color:var(--ink)}
.gone{text-align:center;display:grid;gap:14px;place-content:center;min-height:60vh}
@media print{.wrap{padding:0}header .btn{display:none}}
</style></head>
<body>
<div class="wrap">
  <header><a class="brand" href="/"><i aria-hidden="true"></i>Pitch Pit</a><div style="display:flex;gap:10px" class="noprint"><button class="btn ghost" id="copy" type="button">Copy link</button><button class="btn ghost" id="print" type="button">Print</button><a class="btn" href="/">Pitch your own idea</a></div></header>
  <main id="m" aria-live="polite"><div class="skel" style="width:60%"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:70%"></div></main>
</div>
<script src="/pitch.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id')||'';
$('copy').onclick=()=>copyText(location.href,'Report link copied');
addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
$('print').onclick=()=>print();
fetch('/api/report/'+encodeURIComponent(id)).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
  const p=d.p||{};document.title=`${p.startup||'Pitch'} report · Pitch Pit`;
  $('m').innerHTML=`<p class="who-line"><b>${esc(p.startup)}</b> pitched by ${esc(p.name)} · ${new Date(d.ts).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})} · asked ${fmt(p.amount)} for ${p.equity}%</p>`+
    renderReport({p,val:d.val,inv:d.inv,result:d.result,votes:null,tx:d.tx},{open:true,actions:''})
}).catch(()=>{$('m').innerHTML='<div class="gone"><h1>Report not found</h1><p class="dim">The link may be wrong, or the report was removed. Reports are kept for the most recent 300 pitches.</p><p><a class="btn" href="/">Back to the lobby</a></p></div>'});
</script>
</body></html>
