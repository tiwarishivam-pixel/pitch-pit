services:
  - type: web
    name: pitch-pit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL
        value: claude-haiku-5-5
      - key: REPORT_MODEL
        value: claude-sonnet-5-5
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: MAX_ROOMS
        value: "20"
